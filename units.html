<!-- ═══ WAITLIST MODAL ═══ -->
<div
  class="modal-overlay"
  id="waitlistOverlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>
  <div class="modal">
    <button
      type="button"
      class="modal-close"
      id="modalClose"
      aria-label="Close waiting list form"
    >
      ✕
    </button>

    <!-- FORM VIEW -->
    <div id="modalForm">
      <h3 id="modalTitle">📋 Join the Waiting List</h3>

      <div class="modal-unit-label" id="modalUnitLabel">
        Unit Size
      </div>

      <form
        id="waitlistForm"
        action="https://formspree.io/f/xjgdewjy"
        method="POST"
      >
        <input
          type="hidden"
          name="unit_size"
          id="hiddenUnitSize"
          value=""
        />

        <input
          type="hidden"
          name="_subject"
          id="hiddenSubject"
          value="Waitlist Request — Keewatin Self Storage"
        />

        <!-- Spam protection -->
        <input
          type="text"
          name="_gotcha"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
          style="display:none"
        />

        <div class="form-group">
          <label for="wl-name">Full Name *</label>

          <input
            type="text"
            id="wl-name"
            name="name"
            placeholder="Your full name"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="wl-contact">
            Phone Number or Email *
          </label>

          <input
            type="text"
            id="wl-contact"
            name="contact"
            placeholder="(651) 555-0100 or you@email.com"
            required
          />

          <div class="form-note">
            We’ll contact you as soon as this unit becomes available.
          </div>
        </div>

        <div class="form-group">
          <label for="wl-timeline">
            When Are You Looking to Rent?
          </label>

          <select id="wl-timeline" name="timeline">
            <option value="">— Select a timeframe —</option>
            <option value="ASAP">
              As soon as possible
            </option>
            <option value="1-2 weeks">
              Within 1–2 weeks
            </option>
            <option value="This month">
              This month
            </option>
            <option value="1-3 months">
              Within 1–3 months
            </option>
            <option value="Just planning ahead">
              Just planning ahead
            </option>
          </select>
        </div>

        <div
          id="waitlistError"
          role="alert"
          style="
            display:none;
            margin-bottom:1rem;
            padding:.75rem;
            border:1px solid #fecaca;
            border-radius:8px;
            background:#fee2e2;
            color:#b91c1c;
            font-size:.9rem;
            line-height:1.5;
          "
        ></div>

        <button type="submit" class="modal-submit">
          Add Me to the Waiting List →
        </button>
      </form>
    </div>

    <!-- SUCCESS VIEW -->
    <div class="modal-success" id="modalSuccess">
      <div class="success-icon">✅</div>

      <h4>You’re on the list!</h4>

      <p>
        We’ll reach out to
        <span id="successContact"></span>
        as soon as a unit opens up.
      </p>

      <p
        style="
          margin-top:.75rem;
          font-size:.82rem;
          color:var(--gray);
        "
      >
        Questions? Call us at
        <a
          href="tel:+16513270146"
          style="color:var(--blue)"
        >
          (651) 327-0146
        </a>
      </p>
    </div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/availability.js"></script>

<script>
  // ── Waitlist modal ───────────────────────────────────────────

  const overlay =
    document.getElementById('waitlistOverlay');

  const modalForm =
    document.getElementById('modalForm');

  const modalSuccess =
    document.getElementById('modalSuccess');

  const form =
    document.getElementById('waitlistForm');

  const errorBox =
    document.getElementById('waitlistError');

  const unitLabels = {
    '8x10': '8×10 Unit (80 sq ft) — $60/mo',
    '10x10': '10×10 Unit (100 sq ft) — $85/mo',
    '12x10': '12×10 Unit (120 sq ft) — $90/mo',
    '10x24': '10×24 Unit (240 sq ft) — $115/mo',
  };

  function openWaitlist(unitKey, unitLabel) {
    const selectedLabel =
      unitLabel || unitLabels[unitKey] || unitKey;

    document.getElementById(
      'modalUnitLabel'
    ).textContent = 'Unit: ' + selectedLabel;

    document.getElementById(
      'hiddenUnitSize'
    ).value = selectedLabel;

    document.getElementById(
      'hiddenSubject'
    ).value =
      'Waitlist — ' +
      selectedLabel +
      ' — Keewatin Self Storage';

    modalForm.style.display = '';
    modalSuccess.style.display = 'none';

    errorBox.textContent = '';
    errorBox.style.display = 'none';

    overlay.classList.add('open');

    window.setTimeout(function () {
      document.getElementById('wl-name').focus();
    }, 50);
  }

  function closeWaitlist() {
    overlay.classList.remove('open');
  }

  // Close button
  document
    .getElementById('modalClose')
    .addEventListener('click', closeWaitlist);

  // Close when clicking outside the modal
  overlay.addEventListener(
    'click',
    function (event) {
      if (event.target === overlay) {
        closeWaitlist();
      }
    }
  );

  // Close with Escape
  document.addEventListener(
    'keydown',
    function (event) {
      if (event.key === 'Escape') {
        closeWaitlist();
      }
    }
  );

  // Handle dynamically generated waitlist buttons
  document.addEventListener(
    'click',
    function (event) {
      const button =
        event.target.closest('[data-waitlist]');

      if (!button) return;

      event.preventDefault();

      openWaitlist(
        button.dataset.waitlist,
        button.dataset.label
      );
    }
  );

  // Automatically open the selected waitlist modal
  // when arriving from the homepage.
  (function autoOpenWaitlist() {
    const params =
      new URLSearchParams(window.location.search);

    const unitKey = params.get('waitlist');

    if (!unitKey) return;

    let attempts = 0;

    const checkForButton =
      window.setInterval(function () {
        attempts += 1;

        const button = document.querySelector(
          '[data-waitlist="' + unitKey + '"]'
        );

        if (button || attempts > 20) {
          window.clearInterval(checkForButton);

          openWaitlist(
            unitKey,
            button
              ? button.dataset.label
              : unitLabels[unitKey]
          );
        }
      }, 100);
  })();

  // ── Formspree submission ─────────────────────────────────────

  form.addEventListener(
    'submit',
    async function (event) {
      event.preventDefault();

      const submitButton =
        form.querySelector('.modal-submit');

      const contactField =
        document.getElementById('wl-contact');

      errorBox.textContent = '';
      errorBox.style.display = 'none';

      submitButton.textContent =
        'Adding You to the List…';

      submitButton.disabled = true;

      try {
        const response = await fetch(
          'https://formspree.io/f/xjgdewjy',
          {
            method: 'POST',
            body: new FormData(form),
            headers: {
              Accept: 'application/json',
            },
          }
        );

        const result = await response
          .json()
          .catch(function () {
            return {};
          });

        if (!response.ok) {
          let errorMessage =
            'We could not add you to the waiting list. Please try again.';

          if (
            Array.isArray(result.errors) &&
            result.errors.length > 0
          ) {
            errorMessage = result.errors
              .map(function (error) {
                return error.message;
              })
              .filter(Boolean)
              .join(' ');
          } else if (result.error) {
            errorMessage = result.error;
          }

          throw new Error(errorMessage);
        }

        document.getElementById(
          'successContact'
        ).textContent = contactField.value;

        modalForm.style.display = 'none';
        modalSuccess.style.display = 'block';

        form.reset();
      } catch (error) {
        console.error(
          'Waitlist submission failed:',
          error
        );

        errorBox.textContent =
          error instanceof Error
            ? error.message
            : 'Something went wrong. Please call (651) 327-0146 to join the waiting list.';

        errorBox.style.display = 'block';
      } finally {
        submitButton.textContent =
          'Add Me to the Waiting List →';

        submitButton.disabled = false;
      }
    }
  );
</script>
